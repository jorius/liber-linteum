[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]
exclude = ["crates/nimw-crypto/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# M1a vault core
blake3 = "1.8.7"
dunce = "1.0.5"
globset = "0.4.20"
notify = "8.2.0"
percent-encoding = "2.3.2"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"
trash = "5.2.9"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
yaml-rust2 = "0.13.0"
# M1a test/bench only
criterion = "0.8.2"
proptest = "1.12.0"
tempfile = "3.27.0"
tauri = "2.12.3"
tauri-build = "2.7.2"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-opener = "2.7.1"
# M4c: a second launch hands its files to the running app (Windows, Linux)
tauri-plugin-single-instance = "2.5.4"
# M7: Notion export zips (read; deflate only, pure-Rust zlib)
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# M2b: installed font families (local files only)
fontdb = "0.24.0"
# M6 audio clips: capture and WAV (MP3 deferred: LAME does not cross-build for Windows)
cpal = "0.18.2"
hound = "3.5.1"
# Encryption E1 (nimw-crypto)
aes-gcm = "0.11.1"
aes-siv = "0.8.0"
hkdf = "0.13.0"
hmac = "0.13.0"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "parallel", "zeroize"] }
x-wing = { version = "0.1.1", features = ["zeroize"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
rand_core = "0.10.1"
zeroize = "1.9.1"
subtle = "2.6.1"
region = "4.0.1"
data-encoding = "2.11.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
