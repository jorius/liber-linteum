[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# M1a vault core
blake3 = "1.8.7"
dunce = "1.0.5"
globset = "0.4.20"
notify = "8.2.0"
percent-encoding = "2.3.2"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"
trash = "5.2.9"
unicode-normalization = "0.1.25"
yaml-rust2 = "0.13.0"
# M1a test/bench only
criterion = "0.8.2"
proptest = "1.12.0"
tempfile = "3.27.0"
tauri = "2.12.3"
tauri-build = "2.7.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
