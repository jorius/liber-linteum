[package]
name = "liber-desktop"
description = "Liber Linteum desktop shell."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "liber_desktop"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
dunce.workspace = true
percent-encoding.workspace = true
fontdb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
liber-session = { path = "../../../crates/liber-session" }
liber-vault = { path = "../../../crates/liber-vault" }
liber-crypto = { path = "../../../crates/liber-crypto" }
liber-markdown = { path = "../../../crates/liber-markdown" }
liber-audio = { path = "../../../crates/liber-audio" }
liber-import = { path = "../../../crates/liber-import" }
liber-spell = { path = "../../../crates/liber-spell" }

# M4c §3: files opened from Explorer or a command line while the app runs
# reach the running app (macOS sends them to it itself: `RunEvent::Opened`).
# M5b final review I2: the Dock's Quit, logout and shutdown reach the windows.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance.workspace = true

[features]
# Tiny Argon2 parameters for test vaults (never in a release build): vaults
# below the floor, and the floor itself for new passphrase slots.
test-params = ["liber-vault/test-params"]

[dev-dependencies]
# Its own integration tests build with `test-params`.
liber-desktop = { path = ".", features = ["test-params"] }
liber-crypto = { path = "../../../crates/liber-crypto", features = ["test-params"] }
tauri = { workspace = true, features = ["test"] }
liber-vault = { path = "../../../crates/liber-vault", features = ["test-storage"] }
tempfile.workspace = true
liber-testkit = { path = "../../../crates/liber-testkit" }
zip.workspace = true

# Runs on the process main thread (muda menus can only be created there).
[[test]]
name = "menu"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }
