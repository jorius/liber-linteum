[package]
name = "nimw-desktop"
description = "Notes In My Way desktop shell."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "nimw_desktop"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
dunce.workspace = true
percent-encoding.workspace = true
fontdb.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
nimw-session = { path = "../../../crates/nimw-session" }
nimw-vault = { path = "../../../crates/nimw-vault" }
nimw-markdown = { path = "../../../crates/nimw-markdown" }

# M4c §3: files opened from Explorer or a command line while the app runs
# reach the running app (macOS sends them to it itself: `RunEvent::Opened`).
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance.workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }
tempfile.workspace = true
nimw-testkit = { path = "../../../crates/nimw-testkit" }

# Runs on the process main thread (muda menus can only be created there).
[[test]]
name = "menu"
harness = false

[lints.clippy]
all = { level = "warn", priority = -1 }
