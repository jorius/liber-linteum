<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS: app-icon.svg's artwork inside Apple's icon grid, an 824 × 824
       rounded square (radius 184) centred on a transparent 1024 canvas. Only
       icon.icns is made from it. The soft drop shadow is stacked translucent
       squares: sips (CoreSVG) draws no SVG filters.
       To regenerate (macOS), from the repo root, with <tmp> a new folder (an absolute path):
         sips -s format png apps/desktop/src-tauri/icons/app-icon-macos.svg -o <tmp>/icon.png
         pnpm -F @liber/desktop tauri icon <tmp>/icon.png -o <tmp>/out
         cp <tmp>/out/icon.icns apps/desktop/src-tauri/icons/icon.icns
       The other sizes come from app-icon.svg the same way (copy every output
       except icon.icns). -->
