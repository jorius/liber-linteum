[package]
name = "liber-vault"
description = "Vault filesystem model: scanning, watching, atomic writes, trash."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
dunce.workspace = true
globset.workspace = true
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
trash.workspace = true
unicode-normalization.workspace = true

[features]
# `LIBER_TEST_STORAGE` picks the storage `Vault::open` uses (tests only; see
# docs/architecture/storage-seam.md).
test-storage = []

[dev-dependencies]
# Its own integration tests follow the switch too.
liber-vault = { path = ".", features = ["test-storage"] }
liber-testkit = { path = "../liber-testkit" }
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
